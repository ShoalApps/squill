name: Validate changes

on:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v6
      - name: Build app and UI tests; run unit tests
        run: ./gradlew testDebugUnitTest :core:test :desktop:test assembleDebug assembleDebugAndroidTest --stacktrace
